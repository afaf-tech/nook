name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      # The keychain has three backends, and only one of them is compiled on each host, so the
      # suite runs everywhere rather than on macOS alone.
      - name: apt packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsecret-tools

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: layers
        run: cargo xtask layers

      # The checklist is generated on one platform and compared everywhere: it is a function of the
      # registry, not of the host, so a difference is a real difference.
      - name: parity is up to date
        run: cargo xtask parity-check
